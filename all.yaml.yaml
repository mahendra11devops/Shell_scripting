## Why Separate UDM?

* Loose coupling
* Reusable enterprise data layer
* Better scalability

## Why AIS Separate?

* High-performance rule engine
* Real-time detection

## Why ActOne?

* Dedicated investigator workflow
* Better analyst productivity

## Why ERM?

* Centralized enterprise risk visibility
* Regulatory reporting

