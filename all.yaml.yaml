# pipeline with AWS Tools:

pipeline {
    agent any
    
    environment {
        AWS_ACCOUNT_ID = "123456789012" // Apna AWS Account ID yahan dalein
        AWS_REGION     = "ap-south-1"   // Pune/Mumbai Region
        IMAGE_REPO     = "my-app-repo"
        IMAGE_TAG      = "${env.BUILD_NUMBER}"
        CLUSTER_NAME   = "my-eks-cluster"
    }

    stages {
        stage('Checkout Source') {
            steps {
                // CodeCommit se code uthane ke liye
                checkout scm
            }
        }

        stage('Login to AWS ECR') {
            steps {
                script {
                    sh "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                }
            }
        }

        stage('Build Docker Image') {
            steps {
                script {
                    // Image build karna
                    sh "docker build -t ${IMAGE_REPO}:${IMAGE_TAG} ."
                    // Image ko ECR format mein tag karna
                    sh "docker tag ${IMAGE_REPO}:${IMAGE_TAG} ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${IMAGE_REPO}:${IMAGE_TAG}"
                }
            }
        }

        stage('Push Image to AWS ECR') {
            steps {
                script {
                    sh "docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${IMAGE_REPO}:${IMAGE_TAG}"
                }
            }
        }

        stage('Deploy to Amazon EKS') {
            steps {
                script {
                    // Kubeconfig update karna deployment ke liye
                    sh "aws eks update-kubeconfig --region ${AWS_REGION} --name ${CLUSTER_NAME}"
                    
                    // Kubernetes deployment file mein image tag update karke apply karna
                    sh "kubectl set image deployment/my-app-deployment my-app-container=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${IMAGE_REPO}:${IMAGE_TAG}"
                    
                    // Rollout status check karna
                    sh "kubectl rollout status deployment/my-app-deployment"
                }
            }
        }
    }

    post {
        success {
            echo "Deployment Successful on AWS!"
            // Aap yahan AWS SNS use karke notification bhej sakte hain
        }
        failure {
            echo "Deployment Failed. Check CloudWatch logs."
        }
    }
}

