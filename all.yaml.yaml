# Simple Flow Explanation (Interview Friendly)

## Step 1 — Source Systems

Bank ke multiple systems se transactions aur customer data aata hai.

Examples:

* Core banking
* Cards
* SWIFT
* Internet banking

---

## Step 2 — UDM (Unified Data Model)

UDM ka kaam:

* Different formats ko standard format mein convert karna
* Customer aur transaction ka unified view banana
* Clean & normalized data AIS ko dena

---

## Step 3 — AIS (Actimize Intelligence Server)

AIS:

* Real-time transactions process karta hai
* AML/Fraud rules apply karta hai
* Suspicious activity detect karta hai
* Alerts generate karta hai

Example:

* High-value transfer
* Structuring
* Multiple failed logins
* Sanction hit

---

## Step 4 — ActOne (Visual Investigator)

Analyst yaha:

* Alerts investigate karta hai
* Case manage karta hai
* SAR file karta hai
* Escalation karta hai

Ye basically investigator ka UI hai.

---

## Step 5 — ERM (Enterprise Risk Manager)

ERM:

* Entire bank ka risk view maintain karta hai
* Enterprise level dashboards provide karta hai
* Compliance & governance reporting karta hai

Senior management yaha monitoring karta hai.

---

# Interview One-Line Summary

> “UDM standardize karta hai data ko, AIS fraud/AML detect karta hai, ActOne investigation aur case management handle karta hai, aur ERM enterprise-wide risk monitoring provide karta hai.”

